name: Harmonogram wyłączeń – Leśnice II

on:
  schedule:
    - cron: "0 19 * * *"
  workflow_dispatch:
    inputs:
      data_date:
        description: "Data YYYY-MM-DD (puste = jutro)"
        required: false
        default: ""
      prog_zl:
        description: "Próg opłacalności [zł/MWh]"
        required: false
        default: "24"

jobs:
  harmonogram:
    name: Wyznacz okna wyłączeń i wyślij mailem
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v4
      - name: Konfiguracja Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Instalacja zależności
        run: pip install --upgrade pip requests matplotlib numpy
      - name: Wyznacz harmonogram i wyślij mailem
        env:
          PSE_DATE:   ${{ github.event.inputs.data_date }}
          PROG_ZL:    ${{ github.event.inputs.prog_zl }}
          CHART_PATH: wylaczenia_chart.png
          BODY_PATH:  wylaczenia_body.txt
          SMTP_HOST:  ${{ secrets.SMTP_HOST }}
          SMTP_PORT:  ${{ secrets.SMTP_PORT }}
          SMTP_USER:  ${{ secrets.SMTP_USER }}
          SMTP_PASS:  ${{ secrets.SMTP_PASS }}
          RECIPIENT:  ${{ secrets.RECIPIENT }}
          RECIPIENT2: ${{ secrets.RECIPIENT2 }}
        run: python pse_wylaczenia.py
      - name: Archiwizuj jako artefakt (30 dni)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wylaczenia
          path: |
            wylaczenia_chart.png
            wylaczenia_body.txt
          retention-days: 30
