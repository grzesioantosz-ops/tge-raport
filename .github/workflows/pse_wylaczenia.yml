name: Harmonogram wyłączeń Leśnice II
on:
  schedule:
    # 14:35 UTC = 16:35 latem (CEST) / 15:35 zimą (CET).
    # Celowo wczesne popołudnie: ceny PSE na jutro są już po ~14:00,
    # a GitHub często opóźnia crony o kilkadziesiąt min/kilka godzin,
    # więc wczesna pora daje duży zapas, by mail dotarł tego samego dnia.
    # Nietypowa minuta (:35) omija szczyt kolejki pełnych godzin.
    - cron: "35 14 * * *"
  workflow_dispatch:
    inputs:
      data_date:
        description: "Data YYYY-MM-DD (puste = jutro)"
        required: false
        default: ""
      prog_zl:
        description: "Prog oplacalnosci zl/MWh"
        required: false
        default: "24"
jobs:
  harmonogram:
    name: Wyznacz okna wylaczen i wyslij mailem
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v4
      - name: Konfiguracja Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalacja zaleznosci
        run: pip install requests matplotlib numpy
      - name: Wyznacz harmonogram i wyslij mailem
        env:
          PSE_DATE: ${{ github.event.inputs.data_date }}
          PROG_ZL: ${{ github.event.inputs.prog_zl }}
          CHART_PATH: wylaczenia_chart.png
          BODY_PATH: wylaczenia_body.txt
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          RECIPIENT: ${{ secrets.RECIPIENT }}
          RECIPIENT2: ${{ secrets.RECIPIENT2 }}
        run: python pse_wylaczenia.py
      - name: Archiwizuj artefakt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wylaczenia
          path: |
            wylaczenia_chart.png
            wylaczenia_body.txt
          retention-days: 30
