name: Harmonogram wyłączeń – Leśnice II

on:
  schedule:
    # 21:00 czasu polskiego. 19:00 UTC = 21:00 CEST (lato).
    # Zimą (czas CET) zmień na "0 20 * * *", by trafić w 21:00.
    - cron: "0 19 * * *"
  workflow_dispatch:
    inputs:
      data_date:
        description: "Data YYYY-MM-DD (puste = jutro)"
        required: false
        default: ""
      prog_zl:
        description: "Próg opłacalności [zł/MWh]"
        required: false
        default: "24"

jobs:
  harmonogram:
    name: Wyznacz okna wyłączeń i wyślij mailem
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v4

      - name: Konfiguracja Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalacja zależności
        run: pip install --upgrade pip requests matplotlib numpy

      - name: Wyznacz harmonogram wyłączeń
        env:
          PSE_DATE:   ${{ github.event.inputs.data_date }}
          PROG_ZL:    ${{ github.event.inputs.prog_zl }}
          CHART_PATH: wylaczenia_chart.png
          BODY_PATH:  wylaczenia_body.txt
        run: python pse_wylaczenia.py

      - name: Wyślij harmonogram e-mailem
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          secure: false
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          from: "Leśnice II PV <${{ secrets.MAIL_USERNAME }}>"
          to: ${{ secrets.MAIL_TO }}
          subject: "Leśnice II ${{ env.REPORT_DATE }} – ${{ env.SUBJECT_INFO }}"
          body_file: wylaczenia_body.txt
          attachments: wylaczenia_chart.png
          content_type: text/plain

      - name: Archiwizuj jako artefakt (30 dni)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wylaczenia-${{ env.REPORT_DATE }}
          path: |
            wylaczenia_chart.png
            wylaczenia_body.txt
          retention-days: 30
